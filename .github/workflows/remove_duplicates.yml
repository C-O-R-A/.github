name: Remove duplicate issues

on:
  schedule:
    - cron: 0 * * * *  
  workflow_dispatch:
    inputs:
      org:
        description: 'Organization to scan for duplicate issues'
        required: false
        default: 'C-O-R-A'
      include_archived:
        description: 'Include archived repositories'
        required: false
        type: boolean
        default: false

permissions:
  issues: write

jobs:
  dedupe-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Close duplicate issues across all repos in the org
        uses: actions/github-script@v7
        env:
          ORG: ${{ github.event.inputs.org || 'C-O-R-A' }}
          INCLUDE_ARCHIVED: ${{ github.event.inputs.include_archived || 'false' }}
        with:
          github-token: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const org = process.env.ORG || 'C-O-R-A';
            const includeArchived = process.env.INCLUDE_ARCHIVED === 'true';

            const repos = [];

            for await (const response of github.paginate.iterator(github.rest.repos.listForOrg, {
              org,
              type: 'all',
              per_page: 100
            })) {
              for (const repo of response.data) {
                if (!includeArchived && repo.archived) continue;
                repos.push(repo);
              }
            }

            core.info(`Scanning ${repos.length} repositories in ${org}`);

            for (const repo of repos) {
              const owner = org;
              const repoName = repo.name;

              try {
                const issues = await github.paginate(github.rest.issues.listForRepo, {
                  owner,
                  repo: repoName,
                  state: 'open',
                  per_page: 100,
                  sort: 'created',
                  direction: 'asc'
                });

                const byTitle = new Map();

                for (const issue of issues) {
                  if (issue.pull_request) continue;

                  const title = issue.title?.trim();
                  if (!title) continue;

                  if (!byTitle.has(title)) {
                    byTitle.set(title, []);
                  }
                  byTitle.get(title).push(issue);
                }

                for (const [title, items] of byTitle.entries()) {
                  if (items.length < 2) continue;

                  items.sort((a, b) => {
                    const aDate = new Date(a.created_at).getTime();
                    const bDate = new Date(b.created_at).getTime();
                    return aDate - bDate || a.number - b.number;
                  });

                  const oldest = items[0];

                  for (const issue of items.slice(1)) {
                    const isYounger = new Date(issue.created_at).getTime() > new Date(oldest.created_at).getTime();

                    if (!isYounger) continue;

                    await github.rest.issues.createComment({
                      owner,
                      repo: repoName,
                      issue_number: issue.number,
                      body: `Closing as duplicate of #${oldest.number} because this issue has the same title and was created after the oldest record for this title.`
                    });

                    await github.rest.issues.update({
                      owner,
                      repo: repoName,
                      issue_number: issue.number,
                      state: 'closed'
                    });

                    core.info(`Closed duplicate issue #${issue.number} in ${owner}/${repoName} for title: "${title}"`);
                  }
                }
              } catch (error) {
                core.warning(`Failed to process ${owner}/${repoName}: ${error.message}`);
              }
            }
