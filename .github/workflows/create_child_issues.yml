name: Create child issues from checklists

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  create-child-issues:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Process checklists
        env:
          GH_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          ORGANIZATION: C-O-R-A
          PROJECT_NUMBER: "2"
        run: bash .github/scripts/create_child_issues.sh
